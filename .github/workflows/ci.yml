name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  ml-service:
    name: ML service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile predictor.py shap_explainer.py train.py evaluate.py app.py emission_utils.py
      # The v3 parity test drives backend/utils/tripEngine, which requires
      # mongoose (factorResolver falls back to config/emission-factors.json when
      # no DB is connected), so this job needs backend deps too.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps for parity test
        run: npm ci
        working-directory: backend
      # Spawns scripts/trip_parity_check.py itself and asserts JS == Python
      # per case, so the Python side does not need a separate step.
      - name: JS/Python trip parity (v3 trip engine)
        run: node ../scripts/trip_parity_test.js
        env:
          PYTHON: python

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
